name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  SERVICE: hackspire-backend
  REGION: ${{ vars.GCP_REGION }}
  REPO: hackspire-images

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Write Cloud Run env vars file
        run: |
          {
            echo "DATABASE_URL: \"${{ secrets.DATABASE_URL }}\""
            echo "JWT_SECRET: \"${{ secrets.JWT_SECRET }}\""
            echo "JWT_EXPIRES_MIN: \"${{ secrets.JWT_EXPIRES_MIN }}\""
            echo "ADMIN_EMAIL: \"${{ secrets.ADMIN_EMAIL }}\""
            echo "ADMIN_PASSWORD: \"${{ secrets.ADMIN_PASSWORD }}\""
            echo "ADMIN_NAME: \"${{ secrets.ADMIN_NAME }}\""
            echo "ADMIN_STUDENT_STAFF_ID: \"${{ secrets.ADMIN_STUDENT_STAFF_ID }}\""
            echo "SUPABASE_URL: \"${{ secrets.SUPABASE_URL }}\""
            echo "SUPABASE_ANON_KEY: \"${{ secrets.SUPABASE_ANON_KEY }}\""
            echo "SUPABASE_SERVICE_ROLE_KEY: \"${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}\""
            echo "SUPABASE_JWT_SECRET: \"${{ secrets.SUPABASE_JWT_SECRET }}\""
            echo "FRONTEND_URL: \"${{ secrets.FRONTEND_URL }}\""
            echo "PARTICIPANT_CAP: \"${{ secrets.PARTICIPANT_CAP }}\""
            echo "SMTP_API: \"${{ secrets.SMTP_API }}\""
            echo "BREVO_INVITE_TEMPLATE_ID: \"${{ secrets.BREVO_INVITE_TEMPLATE_ID }}\""
            echo "USE_BREVO_TRANSACTIONAL_EMAIL: \"${{ secrets.USE_BREVO_TRANSACTIONAL_EMAIL }}\""
          } > env-vars.yaml

      # CORS_ORIGINS is a JSON array and contains commas — deploy-cloudrun's
      # env_vars / env_vars_file inputs both mis-split on embedded commas
      # regardless of quoting, corrupting the value. These are public
      # frontend URLs, not secrets, so it's hardcoded here instead of
      # relying on a hand-typed GitHub secret (which kept losing its
      # quoting when pasted) — set via plain gcloud (which handles
      # --env-vars-file correctly) BEFORE the image deploy below:
      # deploy-cloudrun only *merges* the vars it's given, so if this ran
      # after and the deploy step failed to start (e.g. because a stale
      # CORS_ORIGINS from a previous run was still in place), this cleanup
      # step would never even execute. Add new frontend URLs here directly
      # if the Cloud Run URL ever changes.
      - name: Set CORS_ORIGINS
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --update-env-vars='^@^CORS_ORIGINS=["https://app.hackspirelumina.com","https://hackspirelumina.com","https://www.hackspirelumina.com","https://lumina-frontend-817592154660.asia-southeast1.run.app","https://lumina-frontend-a34zs7dkea-as.a.run.app","http://localhost:5173","http://127.0.0.1:5173"]'

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated
          env_vars_file: env-vars.yaml
